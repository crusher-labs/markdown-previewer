<!DOCTYPE html>
<html lang="en"
      data-default-theme="minimal"
      data-theme-lock="minimal"
      data-default-mode="light"
      data-default-brand="#0ea5e9">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Previewer</title>
    <link rel="icon" href="data:,">
    <!-- Marked.js for Markdown to HTML conversion -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/crusher-ui.min.css" integrity="sha384-EIv1tRpD4TjJA0H6sAVfeiJJyJt6DwPxbTYWSsJzylRFMkqMI6xVARApOqqWm5iI" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/themes/minimal.css" integrity="sha384-QYfQeMTJKWZuoEgfBv8ZvJwG12qr6YW8SF6ziK3aHL9luxKjnoswdj/yek7EwpJN" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.css" integrity="sha384-+mIUnYgeB+0Qf10OjT3tSbT2al2Y8erQfw/uws4os7AxVKNLYeEUW5zHUehGBTVq" crossorigin="anonymous">
    <script defer src="https://cdn.jsdelivr.net/npm/crusher-ui-kit@0.1.6/dist/static/tool-shell.js" integrity="sha384-gNDnPKn5AoF0e4Q555fGbM+snO+UCP3/z4ErG3cyS/Akusg/bzTO+AYmG1WAMnab" crossorigin="anonymous"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }

        .md-page {
            min-block-size: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
        }
        .md-shell {
            width: min(100%, 80rem);
            inline-size: 100%;
            margin-inline: auto;
            padding: var(--crusher-spacing-4);
            display: grid;
            grid-template-columns: 1fr;
            gap: var(--crusher-spacing-4);
            min-block-size: 0;
        }
        @media (min-width: 768px) {
            .md-shell { grid-template-columns: 1fr 1fr; }
        }
        .md-pane {
            display: flex;
            flex-direction: column;
            min-block-size: 0;
        }
        .md-pane-label {
            margin: 0 0 var(--crusher-spacing-2);
            padding-inline: var(--crusher-spacing-2);
            font-size: var(--crusher-font-size-xs);
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--crusher-text-secondary);
        }
        #editor.crusher-tool-control {
            font-family: 'Fira Code', monospace;
            inline-size: 100%;
            block-size: 100%;
            min-block-size: 22rem;
            padding: var(--crusher-spacing-4);
            resize: none;
            flex: 1 1 auto;
        }
        #preview {
            flex: 1 1 auto;
            min-block-size: 22rem;
            padding: var(--crusher-spacing-6);
            overflow-y: auto;
            border: 1px solid var(--crusher-border-primary);
            border-radius: var(--crusher-radius-xl);
            background: var(--crusher-background-surface);
            box-shadow: var(--crusher-shadow-lg);
        }

        /* Tool-specific preview rendering — preserves rich markdown look */
        .preview-content {
            color: var(--crusher-text-primary);
            line-height: var(--crusher-line-height-relaxed);
        }
        .preview-content h1, .preview-content h2, .preview-content h3 {
            padding-bottom: 0.3em;
            margin-top: 24px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--crusher-border-primary);
            color: var(--crusher-text-primary);
        }
        .preview-content h1 { font-size: 2em; font-weight: 600; }
        .preview-content h2 { font-size: 1.5em; font-weight: 600; }
        .preview-content h3 { font-size: 1.25em; font-weight: 600; }
        .preview-content p { margin-bottom: 16px; }
        .preview-content a { color: var(--crusher-color-brand-primary); text-decoration: underline; }
        .preview-content ul, .preview-content ol { margin-left: 20px; margin-bottom: 16px; }
        .preview-content li { margin-bottom: 4px; }
        .preview-content code {
            font-family: 'Fira Code', monospace;
            background-color: var(--crusher-background-muted);
            color: var(--crusher-text-primary);
            padding: 0.2em 0.4em;
            font-size: 85%;
            border-radius: var(--crusher-radius-md);
        }
        .preview-content pre {
            background-color: var(--crusher-background-muted);
            padding: 16px;
            border-radius: var(--crusher-radius-lg);
            overflow-x: auto;
            border: 1px solid var(--crusher-border-primary);
        }
        .preview-content pre code {
            background-color: transparent;
            padding: 0;
        }
        .preview-content blockquote {
            border-left: 4px solid var(--crusher-border-primary);
            padding-left: 16px;
            color: var(--crusher-text-secondary);
            margin-left: 0;
            margin-bottom: 16px;
        }
        .preview-content table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 16px;
        }
        .preview-content th, .preview-content td {
            border: 1px solid var(--crusher-border-primary);
            padding: 8px 12px;
        }
        .preview-content th {
            background-color: var(--crusher-background-muted);
        }
    </style>
</head>
<body class="crusher-tool-page md-page">

    <header class="crusher-tool-header">
        <h1 class="crusher-tool-title">Markdown Live Previewer</h1>
        <p class="crusher-tool-lede">Type Markdown on the left, see the rendered HTML on the right.</p>
    </header>

    <main class="md-shell">
        <div class="md-pane">
            <label for="editor" class="md-pane-label">Markdown Editor</label>
            <textarea id="editor" class="crusher-tool-control"></textarea>
        </div>

        <div class="md-pane">
            <span class="md-pane-label">Live Preview</span>
            <div id="preview" class="preview-content" aria-live="polite"></div>
        </div>
    </main>

    <script>
        // DOM element references
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');

        const initialMarkdown = `# Welcome to the Markdown Previewer!

## Type your Markdown on the left...
...and see the rendered HTML on the right.

### Key Features
- **Live Updates:** Renders as you type.
- **GitHub Flavored Markdown:** Supports tables, code blocks, and more.

\`\`\`javascript
// Here's some example code:
function greet(name) {
  console.log(\`Hello, \${name}!\`);
}
\`\`\`

> This is a blockquote. A classic.

- List item one
- List item two

Check out the [marked.js](https://marked.js.org/) library, which powers this preview.
`;

        // Function to update the preview
        function updatePreview() {
            const markdownText = editor.value;
            preview.innerHTML = marked.parse(markdownText);
        }

        editor.addEventListener('input', updatePreview);
        editor.value = initialMarkdown;
        updatePreview();
    </script>

</body>
</html>
